# AutoQ
source "$SCRIPT_DIR/../configs/common.conf"
REPO="https://github.com/fmlab-iis/AutoQ.git"
DIR="$SIMULATORS_DIR/autoq"
DEPS=("make" "git" "g++" "cmake" "libboost-filesystem-dev" "libboost-test-dev")

# AutoQ's parser is generated by ANTLR 4.13.2 and needs the matching C++ runtime
ANTLR_REPO="https://github.com/antlr/antlr4.git"
ANTLR_VERSION="4.13.2"
ANTLR_DIR="$DIR/antlr4"
ANTLR_PREFIX="$DIR/antlr4-runtime"
