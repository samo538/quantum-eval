# MEDUSA MoToBuddy — ACN (algebraic complex numbers) leaves vs. GMP (mpz) leaves
# https://github.com/samo538/MEDUSA/tree/ACN-algebraic-representation
# Both leaf types are built from the same commit so the comparison is fair.
source "$SCRIPT_DIR/../configs/common.conf"
REPO="https://github.com/samo538/MEDUSA.git"
REF="ACN-algebraic-representation"
DIR="$SIMULATORS_DIR/medusa-acn"
# acn precision: amplitudes in Z[omega, 1/sqrt2], omega = e^(i*pi/N)
ACN_NS=(4 8)
DEPS=("make" "git" "cmake" "g++" "gcc")
