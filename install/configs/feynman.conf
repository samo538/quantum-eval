# FEYNMAN (feynver equivalence checker)
source "$SCRIPT_DIR/../configs/common.conf"
REPO="https://github.com/meamy/feynman.git"
DIR="$SIMULATORS_DIR/feynman"
# GHC + cabal are installed locally via GHCup
DEPS=("make" "git" "curl" "build-essential" "libffi-dev" "libgmp-dev" "libncurses-dev" "zlib1g-dev")

GHCUP_URL="https://downloads.haskell.org/~ghcup/x86_64-linux-ghcup"
GHC_VERSION="9.4.8"
CABAL_VERSION="recommended"
CABAL_FLAGS=("--constraint=mtl < 2.3")
